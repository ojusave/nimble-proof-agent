<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Proof — Find jobs</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#search-form">Skip to search</a>
  <header class="topbar">
    <a href="/" class="brand" aria-label="Proof home"><span class="brand-mark" aria-hidden="true">p</span>proof<span class="brand-section">jobs</span></a>
    <nav aria-label="Search navigation">
      <button id="new-search" class="quiet-button" type="button">New search</button>
      <details class="history" id="history-menu">
        <summary>History</summary>
        <div id="history"><p>No searches yet.</p></div>
      </details>
    </nav>
  </header>

  <main>
    <div class="intro"><h1>Find jobs that fit your résumé.</h1></div>
    <form id="search-form" class="composer">
      <label for="query" class="field-label">Job preferences <span class="optional">optional</span></label>
      <textarea id="query" rows="2" maxlength="1500" placeholder="Developer advocate, remote in the US, Python…"></textarea>
      <div class="composer-toolbar">
        <div class="attachment">
          <label class="attach-button" for="resume-file"><span aria-hidden="true">+</span><span id="upload-title">Attach résumé</span><input type="file" id="resume-file" accept=".pdf,.docx,.txt" aria-label="Attach résumé (PDF, DOCX or TXT, up to 3 MB)"></label>
          <div id="saved-resume" class="saved-resume" hidden>
            <select id="resume-select" aria-label="Saved résumé"></select>
            <button type="button" id="remove-resume" class="remove-button" aria-label="Remove résumé" title="Remove résumé; previous results remain">×</button>
          </div>
        </div>
        <div class="search-actions">
          <label for="count">Results</label><input id="count" type="number" min="1" max="20" value="5" required>
          <button id="search-button" class="primary" type="submit">Search jobs <span aria-hidden="true">↗</span></button>
        </div>
      </div>
      <div class="form-footnote"><span>Saved locally. Sent to Nimble for live searches.</span><span id="resume-status" role="status"></span></div>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="empty" class="sample-prompt"><span>No résumé handy?</span><button type="button" id="demo-button" class="text-button">Try a sample <span aria-hidden="true">→</span></button></div>

    <section id="output" class="output" aria-label="Search results" hidden>
      <div id="run-view">
        <details class="activity" id="activity-panel">
          <summary class="activity-summary">
            <span id="live-dot" class="live-dot" aria-hidden="true"></span>
            <span id="stage" class="stage" role="status">Starting search</span>
            <span id="progress-count" class="progress-count">0 of 5 matches</span>
            <span id="elapsed" class="elapsed">0:00</span>
            <span class="activity-toggle">Activity <span aria-hidden="true">⌄</span></span>
          </summary>
          <div class="activity-body"><div class="activity-heading"><strong id="activity-title">Search activity</strong><span id="activity-mode"></span></div><ol id="activity-feed" aria-label="Backend activity"></ol></div>
        </details>
        <div class="results-heading"><h2 id="result-title">Your shortlist</h2><span id="demo-note" class="sample-badge" title="Fictional résumé and jobs. No live API calls." hidden>Fictional sample</span><a id="export" hidden>Export ↗</a></div>
        <div class="tabs" role="tablist" aria-label="Result types"><button id="matches-tab" role="tab" aria-selected="true" aria-controls="job-list" tabindex="0">Matches <span id="match-count">0</span></button><button id="review-tab" role="tab" aria-selected="false" aria-controls="job-list" tabindex="-1">Needs review <span id="review-count">0</span></button></div>
        <div id="job-list" role="tabpanel" aria-labelledby="matches-tab"></div>
        <div id="shortfall" class="shortfall" hidden></div>
        <details id="excluded-section" class="excluded" hidden><summary id="excluded-title">Excluded listings</summary><div id="excluded-list"></div></details>
      </div>
    </section>
    <footer><a href="https://github.com/ojusave/nimble-proof-agent" target="_blank" rel="noopener noreferrer">Source ↗</a><span id="connection"></span></footer>
  </main>
</body>
</html>
