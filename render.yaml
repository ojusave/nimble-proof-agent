# Reproducible deployment template. Secrets are entered/generated by Render.
services:
  - type: web
    name: nimble-proof-agent
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /api/health
    disk:
      name: proof-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NIMBLE_API_KEY
        sync: false
      - key: PROOF_ACCESS_USER
        value: proof
      - key: PROOF_ACCESS_PASSWORD
        generateValue: true
      - key: PROOF_DATA_DIR
        value: /var/data/proof
